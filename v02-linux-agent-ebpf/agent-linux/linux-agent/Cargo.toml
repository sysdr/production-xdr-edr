[package]
name = "linux-agent"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Linux EDR agent v0 — eBPF process exec → OCSF-shaped JSON"

[[bin]]
name = "linux-agent"
path = "src/main.rs"

[features]
default = []
# Log-only LSM stub notes in live path; enforce is Module 10.
lsm-stub = []

[dependencies]
linux-agent-common = { path = "../linux-agent-common", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
hostname = "0.4"

# Live attach (Aya) is always available on Linux so replay rebuilds do not
# strip --mode live from target/debug/linux-agent. Non-Linux hosts stay
# replay-only (no aya dependency).
[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
